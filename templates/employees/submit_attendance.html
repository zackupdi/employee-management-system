<!DOCTYPE html>
<html>
<head>
    <title>Submit Attendance</title>
</head>
<body>
    <h2>Submit Attendance</h2>
    <form method="post">
        {% csrf_token %}
        <table>
            <tr>
                <th>Employee</th>
                <th>Status</th>
            </tr>
            {% for employee in employees %}
            <tr>
                <td>{{ employee.name }}</td>
                <td>
                    <select name="attendance_{{ employee.id }}">
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                    </select>
                </td>
            </tr>
            {% endfor %}
        </table>
        <br>
        <button type="submit">Submit</button>
    </form>
    <br>
    <a href="{% url 'employee_list' %}">Back to Employee List</a>
</body>
</html>
