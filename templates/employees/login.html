<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body {
      background: linear-gradient(-45deg, #00e8be, #000000, #000000, #00e8be);
      background-size: 400% 400%;
      animation: backgroundShift 15s ease infinite;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    @keyframes backgroundShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .card-login {
      background: rgba(0,0,0,0.15);
      padding: 44px 36px 36px 36px;
      border-radius: 18px;
      box-shadow: 0 0 25px #18bc9c, 0 0 50px #18bc9c80;
      max-width: 410px;
      width: 100%;
      margin: 60px auto 0 auto;
      animation: fadeUp 1s;
      position: relative;
      z-index: 2;
      color: #fff;
    }
    .card-login h2 {
      text-align: center;
      color: #e0f7f1;
      margin-bottom: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px #18bc9c55;
    }
    .form-label {
      font-weight: 500;
      color: #18bc9c;
      letter-spacing: 0.5px;
    }
    .form-control {
      border-radius: 8px;
      border: 1.5px solid #18bc9c;
      background: rgba(255,255,255,0.08);
      color: #fff;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .form-control:focus {
      border-color: #00e8be;
      box-shadow: 0 0 0 0.2rem rgba(0,232,190,.15);
      background-color: rgba(0,232,190,0.08);
      color: #fff;
    }
    .btn-primary {
      background: linear-gradient(90deg, #18bc9c, #00e8be);
      border: none;
      color: #fff;
      font-weight: 600;
      border-radius: 8px;
      padding: 10px 24px;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0 2px 8px rgba(24, 188, 156, 0.18);
      transition: background 0.3s, transform 0.2s;
    }
    .btn-primary:hover {
      background: linear-gradient(90deg, #00e8be, #18bc9c);
      color: #fff;
      transform: translateY(-2px) scale(1.03);
    }
    .signup-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #18bc9c;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .signup-link:hover {
      text-decoration: underline;
      color: #00e8be;
    }
    .login-icon {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 18px;
      font-size: 2.6rem;
      color: #18bc9c;
      text-shadow: 0 2px 8px #18bc9c55;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .alert {
      margin-bottom: 16px;
      padding: 10px 16px;
      border-radius: 6px;
      background: rgba(24,188,156,0.15);
      color: #fff;
      border: 1px solid #18bc9c;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card-login">
    <div class="login-icon">
      {% if user.is_authenticated and user.employee.profile_pic %}
        <img src="{{ user.employee.profile_pic.url }}" alt="Profile Picture" style="width:70px; height:70px; border-radius:50%; border:2px solid #18bc9c; object-fit:cover;">
      {% else %}
        <i class="fas fa-sign-in-alt"></i>
      {% endif %}
    </div>
    <h2>Login</h2>
    <form method="post" autocomplete="off">
      {% csrf_token %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <a href="{% url 'signup' %}" class="signup-link">Don't have an account? Sign up</a>
  </div>
</body>
</html>
