<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delete Employee</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(-45deg, #00e8be, #000000, #000000, #00e8be);
      background-size: 400% 400%;
      animation: backgroundShift 15s ease infinite;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    @keyframes backgroundShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .card {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 16px;
      box-shadow: 0 0 25px #e74c3c, 0 0 50px #e74c3c80;
      color: #fff;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      animation: fadeInUp 1s ease forwards;
      backdrop-filter: blur(6px);
      text-align: center;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px);}
      to { opacity: 1; transform: translateY(0);}
    }
    h2 {
      color: #ff4d4d;
      text-shadow: 0 0 10px #e74c3c;
      margin-bottom: 18px;
      font-size: 2rem;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      margin: 0 10px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3);
      border: none;
    }
    .btn-danger {
      background: linear-gradient(90deg, #e74c3c, #ff4d4d);
      color: #fff;
      box-shadow: 0 0 15px #e74c3c80;
    }
    .btn-danger:hover {
      background: linear-gradient(90deg, #ff4d4d, #e74c3c);
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 20px #e74c3c80;
    }
    .btn-cancel {
      background: linear-gradient(90deg, #18bc9c, #00e8be);
      color: #fff;
      box-shadow: 0 0 10px #18bc9c80;
    }
    .btn-cancel:hover {
      background: linear-gradient(90deg, #00e8be, #18bc9c);
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 20px #18bc9c80;
    }
    .particle {
      position: fixed;
      width: 8px;
      height: 8px;
      background: rgba(231, 76, 60, 0.7);
      border-radius: 50%;
      animation: floatUp 6s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Glowing Particles -->
  <script>
    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      particle.style.left = `${Math.random() * 100}vw`;
      particle.style.animationDuration = `${5 + Math.random() * 5}s`;
      particle.style.opacity = Math.random();
      document.body.appendChild(particle);
    }
  </script>
  <div class="card">
    <h2><i class="fas fa-trash"></i> Delete Employee</h2>
    <p>Are you sure you want to delete <strong>{{ employee.name }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Yes, Delete</button>
      <a href="{% url 'employee_list' %}" class="btn btn-cancel"><i class="fas fa-arrow-left"></i> Cancel</a>
    </form>
  </div>
</body>
</html>
