<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | EMS Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at top, #143d32 0%, #07110e 42%, #040907 100%);
      color: #eef8f4;
      font-family: "DM Sans", sans-serif;
    }
    .signup {
      width: min(440px, 100%);
      background: rgba(11, 28, 22, 0.94);
      border: 1px solid #1d4437;
      border-radius: 20px;
      padding: 32px 28px 26px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.45);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, #16c79a, #27e0b0);
      color: #032017;
      font-size: 26px;
      box-shadow: 0 10px 25px rgba(22, 199, 154, 0.3);
    }
    .title {
      text-align: center;
      font: 800 28px "Manrope", sans-serif;
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      color: #8fa9a0;
      margin-bottom: 22px;
      font-size: 14px;
    }
    .label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
      color: #add0c3;
      letter-spacing: 0.4px;
    }
    .field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #24483d;
      background: #07130f;
      color: white;
      outline: none;
      margin-bottom: 16px;
      transition: 0.2s ease;
    }
    .field:focus {
      border-color: #16c79a;
      box-shadow: 0 0 0 3px rgba(22, 199, 154, 0.15);
    }
    .btn {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #16c79a, #27e0b0);
      color: #032017;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 20px rgba(22, 199, 154, 0.2);
    }
    .btn:hover {
      transform: translateY(-1px);
    }
    .msg {
      padding: 10px 12px;
      border: 1px solid rgba(22, 199, 154, 0.4);
      background: rgba(22, 199, 154, 0.1);
      border-radius: 9px;
      margin-bottom: 16px;
      color: #9cebd9;
      text-align: center;
      font-size: 14px;
    }
    .footer {
      text-align: center;
      margin-top: 18px;
      color: #7d9d95;
      font-size: 13px;
    }
    .footer a {
      color: #67d9bc;
      text-decoration: none;
      font-weight: 700;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="signup">
    <div class="logo"><i class="fa-solid fa-user-plus"></i></div>
    <div class="title">Create account</div>
    <div class="sub">Join Employee Management System</div>

    {% if messages %}
      {% for message in messages %}
        <div class="msg">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" autocomplete="off">
      {% csrf_token %}
      <label class="label">Username</label>
      <input class="field" type="text" name="username" required autocomplete="username" placeholder="Enter username">

      <label class="label">Password</label>
      <input class="field" type="password" name="password1" required autocomplete="new-password" placeholder="Create password">

      <label class="label">Confirm password</label>
      <input class="field" type="password" name="password2" required autocomplete="new-password" placeholder="Repeat password">

      <button class="btn" type="submit">Create account</button>
    </form>

    <div class="footer">
      Already have an account? <a href="{% url 'login' %}">Login</a>
    </div>
  </div>
</body>
</html>
