<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>EMS Pro | Sign In</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 0, #123f32, #07110e 50%, #040907);
            color: #eef8f4;
            font-family: "DM Sans", sans-serif;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .login-panel {
            width: min(430px, 100%);
            background: #0b1c16ef;
            border: 1px solid #1d4437;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 25px 80px #0008;
        }

        .logo {
            width: 62px;
            height: 62px;
            border-radius: 17px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #16c79a, #27e0b0);
            color: #032017;
            font-size: 25px;
            margin: 0 auto 20px;
        }

        .title {
            text-align: center;
            font: 800 28px Manrope, sans-serif;
        }

        .sub {
            text-align: center;
            color: #8fa9a0;
            margin: 8px 0 30px;
            line-height: 1.5;
        }

        .account-label {
            text-align: center;
            color: #6fe2c9;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
        }

        .demo-button {
            position: relative;
            display: block;
            text-decoration: none;
            width: 100%;
            min-height: 74px;
            padding: 15px 18px 15px 58px;
            margin-bottom: 12px;
            border: 1px solid #2b5447;
            border-radius: 12px;
            background: #102a22;
            color: #b9eee1;
            font-weight: 800;
            text-align: left;
            transition: .2s ease;
        }

        .demo-button:hover {
            background: #153b30;
            border-color: #16c79a;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px #0004;
        }

        .demo-button.admin {
            background: linear-gradient(135deg, #123f32, #102a22);
        }

        .demo-button.staff {
            background: #102a22;
        }

        .account-icon {
            position: absolute;
            top: 50%;
            left: 18px;
            width: 27px;
            height: 27px;
            display: grid;
            place-items: center;
            transform: translateY(-50%);
            color: #062319;
            background: #27e0b0;
            border-radius: 9px;
            font-size: 13px;
        }

        .demo-button.staff .account-icon {
            color: #d9fff5;
            background: #1c5948;
        }

        .demo-button strong {
            display: block;
            margin-bottom: 3px;
            font-size: 16px;
        }

        .demo-button span {
            display: block;
            color: #75988e;
            font-size: 12px;
            font-weight: 600;
        }

        .role-title {
            display: block;
            font-size: 16px;
            margin-bottom: 3px;
        }

        .role-description {
            display: block;
            font-size: 12px;
            color: #75988e;
            font-weight: 600;
        }

        .notice {
            margin-top: 20px;
            padding: 11px;
            border: 1px solid #16c79a33;
            background: #16c79a0d;
            border-radius: 10px;
            color: #8fa9a0;
            text-align: center;
            font-size: 12px;
        }

        .footer {
            text-align: center;
            color: #58766d;
            font-size: 12px;
            margin-top: 22px;
        }
    </style>
</head>

<body>

<div class="login-panel">

    <div class="logo">
        ⚙
    </div>

    <div class="title">
        Welcome to EMS
    </div>

    <div class="sub">
        Employee Management System
    </div>

    <div class="account-label">
        Choose Account
    </div>

    <a href="{% url 'demo_login' %}?role=admin" class="demo-button">
        <strong>Admin</strong>
        <span>View the complete admin dashboard</span>
    </a>

    <a href="{% url 'demo_login' %}?role=staff" class="demo-button">
        <strong>Staff</strong>
        <span>View the employee/staff dashboard</span>
    </a>

    <div class="notice">
    Fast access is enabled. No username or password is required.
    </div>

    <div class="footer">
        EMS Pro · Secure Environment
    </div>

</div>

</body>
</html>
