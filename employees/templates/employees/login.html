<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | EMS Pro</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#123f32,#07110e 50%,#040907);color:#eef8f4;font-family:"DM Sans",sans-serif;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);background:#0b1c16eF;border:1px solid #1d4437;border-radius:20px;padding:35px;box-shadow:0 25px 80px #0008}.logo{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#16c79a,#27e0b0);color:#032017;font-size:24px;margin:0 auto 18px}.title{text-align:center;font:800 27px Manrope}.sub{text-align:center;color:#8fa9a0;margin:7px 0 28px}.label{font-size:12px;font-weight:700;color:#a9c3ba;margin-bottom:7px;display:block}.field{width:100%;padding:12px 13px;border-radius:10px;border:1px solid #24483d;background:#07130f;color:white;outline:none;margin-bottom:16px}.field:focus{border-color:#16c79a;box-shadow:0 0 0 3px #16c79a18}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#16c79a,#27e0b0);color:#032017;font-weight:800;font-size:15px}.msg{padding:10px;border:1px solid #16c79a44;background:#16c79a12;border-radius:9px;margin-bottom:15px;color:#9cebd9;text-align:center}.footer{text-align:center;color:#58766d;font-size:12px;margin-top:20px}</style></head><body><div class="login"><div class="logo"><i class="fa-solid fa-users-gear"></i></div><div class="title">Welcome back</div><div class="sub">Sign in to Employee Management System</div>{% if messages %}{% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}{% endif %}<form method="post">{% csrf_token %}<label class="label">Username</label><input class="field" name="username" required autofocus autocomplete="username" placeholder="Enter username"><label class="label">Password</label><input class="field" type="password" name="password" required autocomplete="current-password" placeholder="Enter password"><button class="btn">Sign in <i class="fa-solid fa-arrow-right ms-1"></i></button></form>{% if signup_url %}<div class="footer"><a href="{{ signup_url }}" style="color:#6fe2c9">Create an account</a></div>{% endif %}<div class="footer">Secure employee management workspace</div></div></body></html>
