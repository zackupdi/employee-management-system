<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(-45deg, #00e8be, #000000, #000000, #00e8be);
      background-size: 400% 400%;
      animation: backgroundShift 15s ease infinite;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      padding: 30px;
      min-height: 100vh;
    }
    @keyframes backgroundShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .card {
      max-width: 600px;
      margin: 50px auto;
      padding: 2rem;
      background: rgba(0,0,0,0.15);
      border-radius: 15px;
      box-shadow: 0 0 25px #18bc9c, 0 0 50px #18bc9c80;
      animation: neonGlow 1.5s infinite alternate;
    }
    @keyframes neonGlow {
      from { box-shadow: 0 0 15px #18bc9c; }
      to { box-shadow: 0 0 35px #18bc9c, 0 0 60px #18bc9c; }
    }
    h2 {
      text-align: center;
      color: #e0f7f1;
      text-shadow: 0 0 5px #18bc9c, 0 0 15px #18bc9c, 0 0 30px #18bc9c;
      animation: flicker 2s infinite;
    }
    @keyframes flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
      20%, 24%, 55% { opacity: 0.4; }
    }
    p, ul {
      font-size: 1.1em;
      line-height: 1.6em;
    }
    ul {
      list-style: none;
      padding-left: 0;
      margin-bottom: 20px;
    }
    li {
      margin-bottom: 10px;
    }
    strong {
      color: #18bc9c;
      text-shadow: 0 0 5px #18bc9c;
    }
    .icons {
      text-align: center;
      margin-top: 20px;
    }
    .icons i {
      font-size: 2em;
      color: #18bc9c;
      margin: 0 15px;
      animation: iconGlow 2s ease-in-out infinite alternate;
    }
    @keyframes iconGlow {
      from { text-shadow: 0 0 5px #18bc9c; }
      to { text-shadow: 0 0 20px #18bc9c, 0 0 30px #18bc9c; }
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      background: linear-gradient(90deg, #18bc9c, #00e8be);
      color: #222;
      padding: 10px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 10px #18bc9c;
      transition: background 0.3s, color 0.3s;
    }
    .btn:hover {
      background: linear-gradient(90deg, #00e8be, #18bc9c);
      color: #fff;
    }
  </style>
</head>
<body>
<div class="card">
  <h2><i class="fas fa-envelope"></i> Contact Us</h2>
  <p>
    If you have a question or need help, please contact us:
  </p>
  <ul>
    <li><strong>Email:</strong> info@plan.com</li>
    <li><strong>Phone:</strong> +252 6666575</li>
    <li><strong>Address:</strong> Hargeisa, Somaliland</li>
  </ul>
  <div class="icons">
    <i class="fas fa-envelope"></i>
    <i class="fas fa-phone"></i>
    <i class="fas fa-map-marker-alt"></i>
  </div>
  <a href="{% url 'home' %}" class="btn">&#8592; Back to Home</a>
</div>
</body>
</html>
